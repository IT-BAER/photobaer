[package]
name = "photobaer_engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
