name: Release

on:
  push:
    tags: ['v*']
  # Manual run from main: build, test and publish photobaer-mcp without a GitHub release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Builds the engine first; node tests import the generated engine package.
      - run: pnpm build
      - run: pnpm test
      - run: npm ci --prefix mcp && npm test --prefix mcp && npm run build --prefix mcp

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../photobaer-${GITHUB_REF_NAME}.zip" .)
          # Release notes are the CHANGELOG.md section of this version; the release fails without one.
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 { on = 1; next } /^(## \[|\[[^]]+\]: )/ { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "photobaer-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md

      # photobaer-mcp has its own version: it is published only when mcp/package.json names a new one.
      # Auth is npm trusted publishing (OIDC via id-token: write), set up on npmjs.com for this workflow; no token secret.
      - name: Publish photobaer-mcp
        working-directory: mcp
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "photobaer-mcp@$v" version >/dev/null 2>&1; then echo "photobaer-mcp $v is already published"; exit 0; fi
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install -g npm@^11.5.1
          npm publish --access public
