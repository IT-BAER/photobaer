name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds the engine first; node tests import the generated engine package.
      - run: pnpm build
      - run: pnpm test

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../photobaer-${GITHUB_REF_NAME}.zip" .)
          # Release notes are the CHANGELOG.md section of this version; the release fails without one.
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 { on = 1; next } /^(## \[|\[[^]]+\]: )/ { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" "photobaer-${GITHUB_REF_NAME}.zip" --title "photobaer $GITHUB_REF_NAME" --notes-file notes.md
